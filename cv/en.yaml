services:
  - title: Websites & Landing Pages
    text: High-converting landing pages, storefronts, and user dashboards (Next.js,
      Astro, Tilda). Responsive layout, fast loading, Telegram lead forms.
    proof: "Timeline: 1–3 days for a landing page. See Projects for architecture &
      UI scope."
  - title: Telegram Bots & AI Assistants
    text: Lead-capture bots, booking flows, digital delivery, and customer support
      powered by ChatGPT/Claude/Gemini with payment integration (Stars, cards,
      crypto).
    proof: Production-grade bots covered by automated tests and auto-restart
      watchdogs.
  - title: Web Scrapers & Workflow Automation
    text: Data extraction from any website (including anti-bot protected ones),
      price/channel monitoring, and export to Google Sheets, SQLite, CRM, or
      Telegram.
    proof: Built with Playwright, Camoufox, Scrapling, and REST APIs.
  - title: Company Knowledge Search (RAG)
    text: AI assistant that answers strictly from your internal docs, SOPs, and chat
      history without hallucinating.
    proof: Full-text and semantic search powered by SQLite FTS5 and embeddings.
  - title: Transcription & Voice Bots
    text: Accurate speech-to-text for meetings, video lessons, and voice messages
      with timestamps, plus voice bot flows and Gemini TTS voiceovers.
    proof: Transcription runs locally on faster-whisper with zero per-minute API fees.
