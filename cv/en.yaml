    text: High-converting landing pages, storefronts, and user dashboards.
      Mobile-first responsive layout, fast loading, Telegram lead forms.
    proof: "Timeline: 1–3 days for a landing page. See Projects for UI and
      architecture scope."
  - title: Telegram Bots & AI Assistants
    text: Lead-capture bots, booking flows, digital delivery, and customer support
      powered by LLMs with payment integration (Stars, cards, crypto).
    proof: Production-grade bots covered by automated tests and auto-restart
      watchdogs.
  - title: Web Scrapers & Workflow Automation
    text: Data extraction from complex websites, price/channel monitoring, and clean
      export to Google Sheets, Excel, CRM, or Telegram.
    proof: Structured, reliable data on schedule or on demand.
  - title: Company Knowledge Search
    text: AI assistant that answers strictly from your internal docs, SOPs, and chat
      history without hallucinating.
    proof: Fast full-text and semantic search over your internal materials.
  - title: Transcription & Voice Bots
    text: Accurate speech-to-text for meetings, video lessons, and voice messages
      with timestamps, plus voice features for bots.
    proof: Clean structured transcripts and seamless CRM/bot integration.
