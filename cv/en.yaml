name: SaraWashing
title: Architect of Autonomous AI Systems — manager agents, memory, model
  routing, bots, infrastructure
summary: >
  I build not separate scripts but a living system around AI. It has a director
  that runs a dozen working agent sessions, a memory that loses nothing, a
  router that picks the model and thinking depth for every step, and my own
  servers where all of it runs unattended. Everything shown here runs in
  production, across three machines and a phone. I take a task end to end, from
  research and architecture to tests, deployment and post-launch monitoring. For
  me 'done' means run, deliberately broken and shown in a log. An idea that
  failed an honest check gets closed, not fitted to the result.
