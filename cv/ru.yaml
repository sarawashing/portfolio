summary: >
  Разрабатываю сайты, Telegram-ботов, парсеры и системы автоматизации с ИИ под
  задачи бизнеса — от идеи и дизайна до запуска на сервере. Фокус на скорости и
  понятном результате: типовой лендинг, бота или парсер собираю за 1–3 дня,
  крупные продукты — с личными кабинетами, приёмом оплат, автотестами и
  документацией. Всё, что показано в кейсах, работает в продакшене.
