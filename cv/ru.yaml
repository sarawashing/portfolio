services:
  - title: Сайты и лендинги под ключ
    text: Продающие лендинги, витрины, личные кабинеты и админ-панели. Адаптив под
      мобильные, быстрая загрузка, формы заявок в Telegram.
    proof: "Срок: 1–3 дня для лендинга. Примеры интерфейсов — в разделе «Проекты»."
  - title: Telegram-боты и ИИ-ассистенты
    text: Боты для приёма заявок, записи, выдачи материалов и поддержки клиентов с
      подключением нейросетей и приёмом оплат (Stars, карты, крипто).
    proof: Надёжные решения с автотестами и автоматическим перезапуском при сбое.
  - title: Парсеры и автоматизация рутины
    text: Сбор данных с любых сайтов (включая сложные ресурсы), мониторинг каналов,
      цен и вакансий, выгрузка в Google Sheets, Excel, CRM или Telegram.
    proof: Чистые структурированные данные по расписанию или по запросу.
  - title: Поиск по базе знаний компании
    text: ИИ-ассистент отвечает строго по вашим документам, регламентам и перепискам
      без выдумок и галлюцинаций.
    proof: Быстрый смысловой и полнотекстовый поиск по внутренним материалам.
  - title: Транскрибация и голосовые боты
    text: Расшифровка встреч, видеоуроков и голосовых сообщений в чистый текст с
      таймкодами, а также голосовые функции для ботов.
    proof: Точная расшифровка и удобная выгрузка в текст или базу.
