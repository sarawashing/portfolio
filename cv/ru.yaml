services:
  - title: Сайты и лендинги под ключ
    text: Продающие лендинги, витрины, личные кабинеты и админ-панели (Next.js,
      Astro, Tilda). Адаптив, быстрая загрузка, формы заявок в Telegram.
    proof: "Срок: 1–3 дня для лендинга. Примеры дизайна и интерфейсов — в разделе
      «Проекты»."
  - title: Telegram-боты и ИИ-ассистенты
    text: Боты для приёма заявок, записи, выдачи материалов и поддержки клиентов с
      подключением ChatGPT/Claude/Gemini и приёмом оплат (Stars, карты, крипто).
    proof: Продакшн-решения с автотестами и автоматическим перезапуском при сбое.
  - title: Парсеры и автоматизация рутины
    text: Сбор данных с любых сайтов (включая защищённые), мониторинг каналов, цен и
      вакансий, выгрузка в Google Sheets, SQLite, CRM или Telegram.
    proof: Работа с Playwright, Camoufox, Scrapling и REST API.
  - title: Поиск по базе знаний компании (RAG)
    text: ИИ-ассистент отвечает строго по вашим документам, регламентам и перепискам
      без выдумок и галлюцинаций.
    proof: Полнотекстовый и смысловой поиск (SQLite FTS5 + эмбеддинги).
  - title: Озвучка, расшифровка и видео-автоматизация
    text: Расшифровка голосовых и видеоуроков, голосовые боты, автоматический монтаж
      коротких роликов (нарезка пауз, субтитры, зум, звук).
    proof: Локальная обработка на Whisper и FFmpeg без лишних затрат на API.
