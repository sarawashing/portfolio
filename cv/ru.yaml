name: SaraWashing
title: Архитектор автономных ИИ-систем — агенты-руководители, память,
  маршрутизация моделей, боты, инфраструктура
summary: >
  Я строю не отдельные скрипты, а живую систему вокруг ИИ. В ней есть директор,
  который руководит десятком рабочих сессий агентов, память, из которой ничего
  не пропадает, маршрутизатор, подбирающий модель и глубину размышления под
  каждый шаг, и собственные серверы, на которых всё это работает без присмотра.
  Всё показанное здесь работает в боевом режиме: на трёх машинах и телефоне.
  Беру задачу целиком, от разведки и архитектуры до тестов, деплоя и контроля
  после запуска. Для меня «готово» значит запущено, сломано нарочно и показано в
  логе. Идею, которая не выдержала честной проверки, закрываю, а не подгоняю под
  результат.
